<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>GenWave Radio</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@700;800&family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap');

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#03000a;
    color:white;
    font-family:'Share Tech Mono',monospace;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    background:#03000a url('bg.jpg') center/cover no-repeat;
}

.player{
    width:100%;
    max-width:390px;
    height:100vh;
    min-height:500px;
    padding:22px 20px 18px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    align-items:center;
}

.header{
    text-align:center;
}

.genwave{
    font-family:'Syncopate',sans-serif;
    font-size:28px;
    font-weight:800;
    letter-spacing:6px;
    color:#d4f8ff;
    text-shadow:
        0 0 10px #00f4ff,
        0 0 25px #00f4ff;
}

.radio{
    font-family:'Syncopate',sans-serif;
    font-size:26px;
    font-weight:800;
    letter-spacing:9px;
    color:#ffbbf0;
    text-shadow:
        0 0 10px #ff00a0,
        0 0 25px #ff00a0;
}

.cover{
    position:relative;
    width:250px;
    height:250px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:
        0 0 30px rgba(255,0,160,.5),
        0 0 70px rgba(140,0,255,.3);
}

.ring1{
    position:absolute;
    inset:-9px;
    border-radius:50%;
    border:2px solid #ff00a0;
    box-shadow:0 0 18px #ff00a0;
}

.ring2{
    position:absolute;
    inset:-3px;
    border-radius:50%;
    border:2px solid #00f4ff;
    box-shadow:0 0 12px #00f4ff;
}

.cover-inner{
    width:100%;
    height:100%;
    border-radius:50%;
    overflow:hidden;
    background:#03000a;
    position:relative;
}

.logo{
    width:100%;
    height:100%;
    object-fit:contain;
    padding:15px;
}

.album{
    display:none;
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;
}

.track{
    width:100%;
    text-align:center;
}

.track-name{
    font-size:20px;
    min-height:27px;
    max-width:95%;
    margin:auto;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    text-shadow:0 0 8px white;
}

.station{
    margin-top:5px;
    font-family:'Orbitron',sans-serif;
    font-size:12px;
    font-weight:700;
    letter-spacing:3px;
    color:#00f4ff;
    text-shadow:0 0 8px #00f4ff;
}

.volume{
    width:88%;
    position:relative;
    height:25px;
}

.volume-line{
    position:absolute;
    top:50%;
    left:0;
    width:100%;
    height:4px;
    transform:translateY(-50%);
    background-image:
        radial-gradient(circle,#00f4ff 2px,transparent 2px);
    background-size:9px 4px;
}

#volume{
    position:absolute;
    inset:0;
    width:100%;
    opacity:0;
    z-index:5;
}

.volume-handle{
    position:absolute;
    top:50%;
    width:15px;
    height:15px;
    border-radius:50%;
    background:white;
    border:2px solid #00f4ff;
    box-shadow:0 0 12px #00f4ff;
    transform:translate(-50%,-50%);
    pointer-events:none;
}

.play-area{
    width:100%;
    height:120px;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

.wave{
    position:absolute;
    width:210px;
    height:65px;
    border:1px solid rgba(0,244,255,.5);
    border-radius:50%;
    transform:rotateX(70deg);
    box-shadow:0 0 15px rgba(0,244,255,.5);
}

.play{
    width:82px;
    height:82px;
    border-radius:50%;
    border:2px solid white;
    background:
        radial-gradient(
            circle at 35% 28%,
            white 0%,
            #dffaff 35%,
            #70d9f5 70%,
            #129cc2 100%
        );
    box-shadow:
        0 0 30px #00f4ff,
        0 12px 20px rgba(0,0,0,.7),
        inset 0 -5px 10px rgba(0,130,180,.6);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:10;
    touch-action:manipulation;
}

.play:active{
    transform:scale(.9);
}

.play svg{
    width:30px;
    height:30px;
    fill:#063647;
}

.status{
    width:100%;
    padding-top:12px;
    border-top:1px solid rgba(255,255,255,.12);
    display:flex;
    justify-content:space-between;
    font-family:'Orbitron',sans-serif;
    font-size:11px;
    letter-spacing:1.5px;
}

.live{
    color:#ff0055;
    display:flex;
    gap:7px;
    align-items:center;
}

.dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#ff0055;
    box-shadow:0 0 8px #ff0055;
}

#statusText{
    color:#00f4ff;
}

.error{
    position:absolute;
    left:15px;
    right:15px;
    bottom:70px;
    z-index:100;
    display:none;
    padding:12px;
    border:1px solid #00f4ff;
    border-radius:10px;
    background:rgba(3,0,10,.96);
    color:#bcecff;
    font-size:11px;
    line-height:1.5;
    text-align:center;
    white-space:pre-line;
}

.hidden{
    display:none!important;
}
</style>
</head>

<body>

<div class="player">

    <div class="header">
        <div class="genwave">GENWAVE</div>
        <div class="radio">RADIO</div>
    </div>

    <div class="cover">

        <div class="ring1"></div>
        <div class="ring2"></div>

        <div class="cover-inner">

            <img
                class="logo"
                src="lg.jpg"
                alt="GenWave"
            >

            <img
                id="album"
                class="album"
                src=""
                alt="Album"
            >

        </div>
    </div>

    <div class="track">

        <div
            id="track"
            class="track-name"
        >
            GenWave Radio
        </div>

        <div class="station">
            GENWAVE RADIO
        </div>

    </div>

    <div class="volume">

        <div class="volume-line"></div>

        <div
            id="handle"
            class="volume-handle"
            style="left:80%"
        ></div>

        <input
            id="volume"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="0.8"
        >

    </div>

    <div class="play-area">

        <div class="wave"></div>

        <button
            id="play"
            class="play"
            type="button"
            aria-label="Play"
        >

            <svg
                id="playIcon"
                viewBox="0 0 24 24"
            >
                <path d="M8 5v14l11-7z"/>
            </svg>

            <svg
                id="pauseIcon"
                class="hidden"
                viewBox="0 0 24 24"
            >
                <path d="M6 5h4v14H6zM14 5h4v14h-4z"/>
            </svg>

        </button>

    </div>

    <div class="status">

        <div class="live">
            <span class="dot"></span>
            LIVE
        </div>

        <div id="statusText">
            READY
        </div>

    </div>

</div>

<div
    id="error"
    class="error"
></div>


<audio
    id="audio"
    preload="none"
    playsinline
></audio>


<script>

const STREAM =
    "/radio/listen/genwave/radio.mp3";

const API =
    "/radio/api/nowplaying/genwave";


const audio =
    document.getElementById("audio");

const button =
    document.getElementById("play");

const playIcon =
    document.getElementById("playIcon");

const pauseIcon =
    document.getElementById("pauseIcon");

const volume =
    document.getElementById("volume");

const handle =
    document.getElementById("handle");

const track =
    document.getElementById("track");

const album =
    document.getElementById("album");

const status =
    document.getElementById("statusText");

const errorBox =
    document.getElementById("error");


let isPlaying = false;


/* -------------------------------- */
/* STATUS */
/* -------------------------------- */

function setStatus(text){

    status.textContent = text;

}


/* -------------------------------- */
/* ERROR */
/* -------------------------------- */

function showError(text){

    errorBox.textContent = text;

    errorBox.style.display = "block";

}

function hideError(){

    errorBox.style.display = "none";

}


/* -------------------------------- */
/* BUTTON */
/* -------------------------------- */

function setButtonPlaying(value){

    isPlaying = value;

    if(value){

        playIcon.classList.add("hidden");
        pauseIcon.classList.remove("hidden");

    }else{

        playIcon.classList.remove("hidden");
        pauseIcon.classList.add("hidden");

    }

}


/* -------------------------------- */
/* PLAY */
/* -------------------------------- */

button.addEventListener(
    "click",
    function(){

        console.log(
            "[GENWAVE] BUTTON CLICK"
        );

        hideError();

        if(isPlaying){

            stopRadio();

        }else{

            startRadio();

        }

    },
    false
);


/* -------------------------------- */
/* START RADIO */
/* -------------------------------- */

function startRadio(){

    console.log(
        "[GENWAVE] START"
    );

    setStatus("CONNECTING...");

    button.disabled = true;

    audio.pause();

    audio.src = STREAM;

    audio.volume =
        Number(volume.value);

    console.log(
        "[GENWAVE] STREAM:",
        STREAM
    );


    const promise =
        audio.play();


    if(
        promise &&
        typeof promise.then === "function"
    ){

        promise
        .then(function(){

            console.log(
                "[GENWAVE] PLAY SUCCESS"
            );

            setButtonPlaying(true);

            setStatus("PLAYING");

            button.disabled = false;

        })
        .catch(function(err){

            console.error(
                "[GENWAVE] PLAY ERROR",
                err
            );

            setButtonPlaying(false);

            setStatus("ERROR");

            button.disabled = false;

            showError(
                "PŘEHRÁVÁNÍ SELHALO\n\n" +
                err.name +
                "\n" +
                err.message +
                "\n\n" +
                "STREAM:\n" +
                STREAM
            );

        });

    }

}


/* -------------------------------- */
/* STOP */
/* -------------------------------- */

function stopRadio(){

    console.log(
        "[GENWAVE] STOP"
    );

    audio.pause();

    audio.removeAttribute("src");

    audio.load();

    setButtonPlaying(false);

    setStatus("READY");

}


/* -------------------------------- */
/* AUDIO EVENTS */
/* -------------------------------- */

audio.addEventListener(
    "loadstart",
    function(){

        console.log(
            "[GENWAVE] loadstart"
        );

        setStatus("LOADING...");

    }
);


audio.addEventListener(
    "loadedmetadata",
    function(){

        console.log(
            "[GENWAVE] metadata loaded"
        );

    }
);


audio.addEventListener(
    "canplay",
    function(){

        console.log(
            "[GENWAVE] canplay"
        );

    }
);


audio.addEventListener(
    "playing",
    function(){

        console.log(
            "[GENWAVE] playing"
        );

        setButtonPlaying(true);

        setStatus("PLAYING");

        button.disabled = false;

    }
);


audio.addEventListener(
    "pause",
    function(){

        console.log(
            "[GENWAVE] pause"
        );

    }
);


audio.addEventListener(
    "waiting",
    function(){

        console.log(
            "[GENWAVE] waiting"
        );

        if(isPlaying){

            setStatus("BUFFERING...");

        }

    }
);


audio.addEventListener(
    "stalled",
    function(){

        console.log(
            "[GENWAVE] stalled"
        );

    }
);


audio.addEventListener(
    "error",
    function(){

        console.error(
            "[GENWAVE] AUDIO ERROR",
            audio.error
        );

        setButtonPlaying(false);

        button.disabled = false;

        setStatus("STREAM ERROR");


        let details =
            "AUDIO ERROR\n\n";

        if(audio.error){

            details +=
                "CODE: " +
                audio.error.code +
                "\n";

            if(audio.error.message){

                details +=
                    audio.error.message +
                    "\n";

            }

        }

        details +=
            "\nURL:\n" +
            STREAM;

        showError(details);

    }
);


/* -------------------------------- */
/* VOLUME */
/* -------------------------------- */

volume.addEventListener(
    "input",
    function(){

        const value =
            Number(volume.value);

        audio.volume = value;

        handle.style.left =
            (value * 100) + "%";

    }
);


/* -------------------------------- */
/* METADATA */
/* -------------------------------- */

async function updateMetadata(){

    try{

        console.log(
            "[GENWAVE] API request"
        );

        const response =
            await fetch(
                API +
                "?t=" +
                Date.now(),
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        console.log(
            "[GENWAVE] API OK",
            data
        );


        if(
            data.now_playing &&
            data.now_playing.song
        ){

            const song =
                data.now_playing.song;


            if(song.text){

                track.textContent =
                    song.text;

            }


            if(song.art){

                try{

                    const art =
                        new URL(song.art);

                    if(
                        art.hostname ===
                        "genwave-radio.com"
                    ){

                        album.src =
                            "/radio" +
                            art.pathname +
                            art.search;

                    }else{

                        album.src =
                            song.art;

                    }

                    album.style.display =
                        "block";

                }catch(e){

                    console.warn(
                        "[GENWAVE] ART ERROR",
                        e
                    );

                }

            }

        }

    }catch(err){

        console.warn(
            "[GENWAVE] API ERROR",
            err
        );

    }

}


/* -------------------------------- */
/* INIT */
/* -------------------------------- */

audio.volume = 0.8;

volume.value = 0.8;

handle.style.left = "80%";


setStatus("READY");


updateMetadata();


setInterval(
    updateMetadata,
    10000
);


console.log(
    "=============================="
);

console.log(
    "GENWAVE DISCORD ACTIVITY"
);

console.log(
    "STREAM:",
    STREAM
);

console.log(
    "API:",
    API
);

console.log(
    "=============================="
);

</script>

</body>
</html>
