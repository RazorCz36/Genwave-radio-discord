<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#03000a">
    <title>GenWave Radio</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@700;800&family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #03000a;
            overflow: hidden;
            font-family: 'Share Tech Mono', monospace;
            color: #ffffff;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: #03000a url('bg.jpg') center center / cover no-repeat fixed;
        }

        .player-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 390px;
            height: 100vh;
            max-height: 840px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 22px 20px 18px 20px;
        }

        .brand-header {
            text-align: center;
            margin-top: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .brand-genwave {
            font-family: 'Syncopate', sans-serif;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 6px;
            color: #d4f8ff;
            text-shadow:
                0 0 10px rgba(0, 244, 255, 0.8),
                0 0 20px rgba(0, 244, 255, 0.5),
                0 0 35px rgba(0, 244, 255, 0.3);
            line-height: 1.15;
            margin-left: 6px;
        }

        .brand-radio {
            font-family: 'Syncopate', sans-serif;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 9px;
            color: #ffbbf0;
            text-shadow:
                0 0 10px rgba(255, 0, 160, 0.9),
                0 0 22px rgba(255, 0, 160, 0.6),
                0 0 40px rgba(255, 0, 160, 0.4);
            line-height: 1.15;
            margin-left: 9px;
        }

        .circle-display-wrap {
            position: relative;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow:
                0 0 30px rgba(255, 0, 160, 0.4),
                0 0 65px rgba(140, 0, 255, 0.25);
        }

        .ring-magenta {
            position: absolute;
            inset: -9px;
            border-radius: 50%;
            border: 2px solid #ff00a0;
            box-shadow:
                0 0 16px #ff00a0,
                inset 0 0 16px rgba(255, 0, 160, 0.4);
        }

        .ring-cyan {
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            border: 2px solid #00f4ff;
            box-shadow: 0 0 10px #00f4ff;
        }

        .circle-inner-content {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            background: #03000a;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .default-logo-img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
            z-index: 2;
            padding: 15px;
        }

        .cover-art-image {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: none;
            z-index: 3;
        }

        .track-info-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .current-track-name {
            font-family: 'Share Tech Mono', monospace;
            font-size: 20px;
            color: #ffffff;
            text-align: center;
            letter-spacing: 0.5px;
            min-height: 26px;
            max-width: 92%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
        }

        .sub-station-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            font-weight: 700;
            color: #00f4ff;
            letter-spacing: 3px;
            text-shadow: 0 0 8px rgba(0, 244, 255, 0.8);
        }

        .volume-control-wrap {
            width: 88%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .dotted-slider-bar {
            position: relative;
            width: 100%;
            height: 20px;
            display: flex;
            align-items: center;
        }

        .dots-background-line {
            position: absolute;
            width: 100%;
            height: 4px;
            background-image:
                radial-gradient(
                    circle,
                    rgba(0, 244, 255, 0.85) 2px,
                    transparent 2px
                );
            background-size: 9px 4px;
            background-repeat: repeat-x;
            top: 50%;
            transform: translateY(-50%);
            filter: drop-shadow(0 0 3px #00f4ff);
        }

        .volume-native-range {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 10;
        }

        .volume-ring-handle {
            position: absolute;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid #00f4ff;
            box-shadow:
                0 0 10px #00f4ff,
                0 0 18px #00f4ff;
            top: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            transition: left 0.05s ease-out;
        }

        .play-area-3d {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 115px;
        }

        .water-surface-glow {
            position: absolute;
            width: 230px;
            height: 78px;
            border-radius: 50%;
            bottom: 2px;
            background:
                radial-gradient(
                    ellipse at center,
                    rgba(0, 244, 255, 0.4) 0%,
                    rgba(140, 0, 255, 0.15) 50%,
                    transparent 75%
                );
            transform: rotateX(74deg);
            pointer-events: none;
        }

        .water-wave-1 {
            position: absolute;
            width: 165px;
            height: 54px;
            border: 1.5px solid rgba(0, 244, 255, 0.7);
            border-radius: 50%;
            bottom: 14px;
            transform: rotateX(74deg);
            box-shadow: 0 0 12px rgba(0, 244, 255, 0.6);
            animation: waveRipple 3s infinite ease-out;
            pointer-events: none;
        }

        .water-wave-2 {
            position: absolute;
            width: 195px;
            height: 63px;
            border: 1px solid rgba(0, 244, 255, 0.4);
            border-radius: 50%;
            bottom: 8px;
            transform: rotateX(74deg);
            animation: waveRipple 3s infinite ease-out 1.5s;
            pointer-events: none;
        }

        @keyframes waveRipple {
            0% {
                transform: rotateX(74deg) scale(0.55);
                opacity: 1;
            }

            100% {
                transform: rotateX(74deg) scale(1.35);
                opacity: 0;
            }
        }

        .btn-play-3d {
            position: relative;
            z-index: 12;
            width: 78px;
            height: 78px;
            border-radius: 50%;
            background:
                radial-gradient(
                    circle at 35% 28%,
                    #ffffff 0%,
                    #e2f8ff 35%,
                    #76dcf5 70%,
                    #129cc2 100%
                );
            border: 2px solid rgba(255, 255, 255, 0.95);
            box-shadow:
                0 0 26px rgba(0, 244, 255, 0.9),
                0 11px 20px rgba(0, 0, 0, 0.75),
                inset 0 -5px 11px rgba(0, 130, 180, 0.6),
                inset 0 4px 7px rgba(255, 255, 255, 1);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.12s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-play-3d:hover {
            transform: scale(1.04);
        }

        .btn-play-3d:active {
            transform: scale(0.92);
        }

        .btn-play-3d:disabled {
            cursor: wait;
            opacity: 0.75;
        }

        .icon-symbol {
            width: 28px;
            height: 28px;
            fill: #063647;
            filter: drop-shadow(0 1px 1px rgba(255, 255, 255, 0.8));
        }

        .bottom-status-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            font-weight: 500;
            color: #838a9c;
            letter-spacing: 1.5px;
        }

        .live-tag {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #ff0055;
            text-shadow: 0 0 8px rgba(255, 0, 85, 0.8);
        }

        .red-dot-pulsing {
            width: 8px;
            height: 8px;
            background-color: #ff0055;
            border-radius: 50%;
            box-shadow: 0 0 8px #ff0055;
            animation: dotBlink 1.4s infinite;
        }

        @keyframes dotBlink {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.35;
                transform: scale(1.25);
            }
        }

        .bitrate-tag {
            color: #a0a7b8;
        }

        /* Diagnostic message */
        .player-message {
            position: fixed;
            left: 50%;
            bottom: 62px;
            transform: translateX(-50%);
            z-index: 50;
            width: 90%;
            max-width: 360px;
            padding: 10px 14px;
            border: 1px solid rgba(0, 244, 255, 0.35);
            border-radius: 8px;
            background: rgba(3, 0, 10, 0.92);
            color: #bffaff;
            font-family: 'Share Tech Mono', monospace;
            font-size: 12px;
            line-height: 1.35;
            text-align: center;
            white-space: pre-line;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            box-shadow: 0 0 18px rgba(0, 244, 255, 0.15);
        }

        .player-message.show {
            opacity: 1;
        }

        @media (max-height: 650px) {
            .player-container {
                padding-top: 12px;
                padding-bottom: 10px;
            }

            .circle-display-wrap {
                width: 205px;
                height: 205px;
            }

            .play-area-3d {
                height: 90px;
            }

            .brand-genwave {
                font-size: 24px;
            }

            .brand-radio {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="player-container">

        <div class="brand-header">
            <div class="brand-genwave">GENWAVE</div>
            <div class="brand-radio">RADIO</div>
        </div>

        <div class="circle-display-wrap">

            <div class="ring-magenta"></div>
            <div class="ring-cyan"></div>

            <div class="circle-inner-content">

                <img
                    src="lg.jpg"
                    class="default-logo-img"
                    id="defaultLogo"
                    alt="GenWave Logo"
                >

                <img
                    id="albumCover"
                    class="cover-art-image"
                    src=""
                    alt="Album Cover"
                >

            </div>
        </div>

        <div class="track-info-container">

            <div
                class="current-track-name"
                id="trackName"
            >
                GenWave Radio
            </div>

            <div class="sub-station-name">
                GENWAVE RADIO
            </div>

        </div>

        <div class="volume-control-wrap">

            <div class="dotted-slider-bar">

                <div class="dots-background-line"></div>

                <div
                    class="volume-ring-handle"
                    id="volRing"
                    style="left: 80%;"
                ></div>

                <input
                    type="range"
                    class="volume-native-range"
                    id="volRange"
                    min="0"
                    max="1"
                    step="0.01"
                    value="0.8"
                    aria-label="Volume"
                >

            </div>

        </div>

        <div class="play-area-3d">

            <div class="water-surface-glow"></div>
            <div class="water-wave-1"></div>
            <div class="water-wave-2"></div>

            <button
                class="btn-play-3d"
                id="playPauseBtn"
                type="button"
                aria-label="Play"
            >

                <svg
                    id="iconPlay"
                    class="icon-symbol"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path d="M8 5v14l11-7z"/>
                </svg>

                <svg
                    id="iconPause"
                    class="icon-symbol"
                    viewBox="0 0 24 24"
                    style="display: none;"
                    aria-hidden="true"
                >
                    <path d="M6 19h4V5H6v14zm8-14v14h-4z"/>
                </svg>

            </button>

        </div>

        <div class="bottom-status-bar">

            <div class="live-tag">

                <div class="red-dot-pulsing"></div>

                <span>LIVE</span>

            </div>

            <div
                class="bitrate-tag"
                id="bitrateVal"
            >
                192 KBPS
            </div>

        </div>

    </div>

    <div
        class="player-message"
        id="playerMessage"
    ></div>


    <!--
        REAL AUDIO PLAYER

        Důležité:
        - žádný crossOrigin
        - žádný autoplay
        - Play se spouští přímo kliknutím uživatele
    -->

    <audio
        id="radioAudio"
        preload="none"
        playsinline
    ></audio>


    <script>

        /*
         * ==========================================================
         * GENWAVE RADIO
         * Discord Activity / GitHub Pages
         * ==========================================================
         */

        const STREAM_URL =
            "https://genwave-radio.com/listen/genwave/radio.mp3";

        const API_URL =
            "https://genwave-radio.com/api/nowplaying/genwave";

        const DEFAULT_VOLUME = 0.80;

        const METADATA_INTERVAL = 10000;

        const RECONNECT_DELAY = 3000;


        /*
         * ==========================================================
         * ELEMENTS
         * ==========================================================
         */

        const audio =
            document.getElementById("radioAudio");

        const playPauseBtn =
            document.getElementById("playPauseBtn");

        const iconPlay =
            document.getElementById("iconPlay");

        const iconPause =
            document.getElementById("iconPause");

        const albumCover =
            document.getElementById("albumCover");

        const defaultLogo =
            document.getElementById("defaultLogo");

        const trackName =
            document.getElementById("trackName");

        const volRange =
            document.getElementById("volRange");

        const volRing =
            document.getElementById("volRing");

        const bitrateVal =
            document.getElementById("bitrateVal");

        const playerMessage =
            document.getElementById("playerMessage");


        /*
         * ==========================================================
         * STATE
         * ==========================================================
         */

        let isPlaying = false;

        let isStarting = false;

        let reconnectTimer = null;

        let metadataTimer = null;

        let currentArt = null;

        let lastTrack = "";


        /*
         * ==========================================================
         * MESSAGE
         * ==========================================================
         */

        let messageTimer = null;


        function showMessage(
            message,
            duration = 3000
        ) {

            playerMessage.textContent =
                message;

            playerMessage.classList.add(
                "show"
            );

            clearTimeout(
                messageTimer
            );

            if (duration > 0) {

                messageTimer =
                    setTimeout(
                        () => {

                            playerMessage.classList.remove(
                                "show"
                            );

                        },
                        duration
                    );
            }
        }


        function hideMessage() {

            playerMessage.classList.remove(
                "show"
            );

            clearTimeout(
                messageTimer
            );
        }


        /*
         * ==========================================================
         * PLAY / PAUSE VISUAL STATE
         * ==========================================================
         */

        function setPlayingUI(
            playing
        ) {

            isPlaying = playing;

            if (playing) {

                iconPlay.style.display =
                    "none";

                iconPause.style.display =
                    "block";

                playPauseBtn.setAttribute(
                    "aria-label",
                    "Pause"
                );

            } else {

                iconPlay.style.display =
                    "block";

                iconPause.style.display =
                    "none";

                playPauseBtn.setAttribute(
                    "aria-label",
                    "Play"
                );
            }
        }


        /*
         * ==========================================================
         * COVER ART
         * ==========================================================
         */

        function showDefaultLogo() {

            albumCover.style.display =
                "none";

            albumCover.removeAttribute(
                "src"
            );

            defaultLogo.style.display =
                "block";
        }


        function showCover(
            url
        ) {

            if (!url) {

                showDefaultLogo();

                return;
            }


            albumCover.onload =
                function () {

                    albumCover.style.display =
                        "block";

                    defaultLogo.style.display =
                        "none";
                };


            albumCover.onerror =
                function () {

                    showDefaultLogo();
                };


            albumCover.src =
                url;
        }


        /*
         * ==========================================================
         * METADATA
         * ==========================================================
         */

        async function updateMetadata() {

            try {

                const response =
                    await fetch(
                        API_URL +
                        "?_=" +
                        Date.now(),
                        {
                            method: "GET",
                            cache: "no-store"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "HTTP " +
                        response.status
                    );
                }


                const data =
                    await response.json();


                /*
                 * SONG
                 */

                if (
                    data.now_playing &&
                    data.now_playing.song
                ) {

                    const song =
                        data.now_playing.song;


                    const title =
                        song.text ||
                        "GenWave Radio";


                    if (
                        title !== lastTrack
                    ) {

                        lastTrack =
                            title;

                        trackName.textContent =
                            title;
                    }


                    /*
                     * COVER
                     */

                    if (song.art) {

                        currentArt =
                            song.art;

                        if (isPlaying) {

                            showCover(
                                currentArt
                            );
                        }
                    }
                }


                /*
                 * BITRATE
                 */

                if (
                    data.station &&
                    Array.isArray(
                        data.station.mounts
                    ) &&
                    data.station.mounts.length
                ) {

                    const bitrate =
                        data.station.mounts[0].bitrate;


                    if (bitrate) {

                        bitrateVal.textContent =
                            bitrate +
                            " KBPS";
                    }
                }

            } catch (error) {

                /*
                 * Metadata failure must NOT
                 * stop the radio.
                 */

                console.log(
                    "[GenWave] Metadata error:",
                    error
                );
            }
        }


        /*
         * ==========================================================
         *
