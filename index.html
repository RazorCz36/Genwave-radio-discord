<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GenWave Radio</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@700;800&family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap');

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #03000a;
    color: white;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Share Tech Mono', monospace;
    background:
        #03000a url("bg.jpg")
        center center / cover no-repeat;
}

.player {
    width: 100%;
    max-width: 390px;
    height: 100vh;
    min-height: 500px;
    padding: 22px 20px 18px;

    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
}

/* HEADER */

.header {
    text-align: center;
}

.genwave {
    font-family: 'Syncopate', sans-serif;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 6px;
    color: #d4f8ff;

    text-shadow:
        0 0 10px #00f4ff,
        0 0 25px #00f4ff,
        0 0 40px #00f4ff;
}

.radio {
    font-family: 'Syncopate', sans-serif;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 9px;
    color: #ffbbf0;

    text-shadow:
        0 0 10px #ff00a0,
        0 0 25px #ff00a0,
        0 0 40px #ff00a0;
}

/* COVER */

.cover {
    position: relative;
    width: 250px;
    height: 250px;
    border-radius: 50%;

    box-shadow:
        0 0 30px rgba(255,0,160,.5),
        0 0 70px rgba(140,0,255,.3);
}

.ring-pink {
    position: absolute;
    inset: -9px;
    border-radius: 50%;
    border: 2px solid #ff00a0;
    box-shadow: 0 0 18px #ff00a0;
}

.ring-cyan {
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    border: 2px solid #00f4ff;
    box-shadow: 0 0 12px #00f4ff;
}

.cover-inner {
    position: absolute;
    inset: 0;
    overflow: hidden;
    border-radius: 50%;
    background: #03000a;
}

.logo {
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 15px;
}

#coverArt {
    display: none;
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* TRACK */

.track {
    width: 100%;
    text-align: center;
}

#trackName {
    min-height: 27px;
    max-width: 95%;
    margin: auto;

    font-size: 20px;
    color: white;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;

    text-shadow: 0 0 8px white;
}

.station {
    margin-top: 5px;

    font-family: 'Orbitron', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 3px;

    color: #00f4ff;
    text-shadow: 0 0 8px #00f4ff;
}

/* VOLUME */

.volume {
    position: relative;
    width: 88%;
    height: 25px;
}

.volume-line {
    position: absolute;
    top: 50%;
    left: 0;
    width: 100%;
    height: 4px;

    transform: translateY(-50%);

    background-image:
        radial-gradient(
            circle,
            #00f4ff 2px,
            transparent 2px
        );

    background-size: 9px 4px;
}

#volume {
    position: absolute;
    inset: 0;
    width: 100%;
    opacity: 0;
    z-index: 5;
}

.volume-handle {
    position: absolute;
    top: 50%;

    width: 15px;
    height: 15px;

    border-radius: 50%;
    background: white;
    border: 2px solid #00f4ff;

    box-shadow: 0 0 12px #00f4ff;

    transform: translate(-50%, -50%);
    pointer-events: none;
}

/* PLAY */

.play-area {
    position: relative;

    width: 100%;
    height: 120px;

    display: flex;
    justify-content: center;
    align-items: center;
}

.wave {
    position: absolute;

    width: 210px;
    height: 65px;

    border:
        1px solid
        rgba(0,244,255,.5);

    border-radius: 50%;

    transform: rotateX(70deg);

    box-shadow:
        0 0 15px
        rgba(0,244,255,.5);
}

#playButton {
    position: relative;
    z-index: 20;

    width: 82px;
    height: 82px;

    border-radius: 50%;
    border: 2px solid white;

    background:
        radial-gradient(
            circle at 35% 28%,
            white 0%,
            #dffaff 35%,
            #70d9f5 70%,
            #129cc2 100%
        );

    box-shadow:
        0 0 30px #00f4ff,
        0 12px 20px rgba(0,0,0,.7),
        inset 0 -5px 10px rgba(0,130,180,.6);

    cursor: pointer;

    display: flex;
    justify-content: center;
    align-items: center;

    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
}

#playButton:active {
    transform: scale(.9);
}

#playButton svg {
    width: 30px;
    height: 30px;
    fill: #063647;
}

/* STATUS */

.status {
    width: 100%;

    padding-top: 12px;

    border-top:
        1px solid
        rgba(255,255,255,.12);

    display: flex;
    justify-content: space-between;
    align-items: center;

    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    letter-spacing: 1.5px;
}

.live {
    display: flex;
    align-items: center;
    gap: 7px;

    color: #ff0055;
}

.dot {
    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #ff0055;

    box-shadow:
        0 0 8px #ff0055;
}

#state {
    color: #00f4ff;
}

/* DEBUG */

#debug {
    position: fixed;

    left: 10px;
    right: 10px;
    bottom: 60px;

    display: none;

    padding: 10px;

    border:
        1px solid
        rgba(0,244,255,.5);

    border-radius: 8px;

    background:
        rgba(0,0,0,.95);

    color: #00f4ff;

    font-size: 11px;
    line-height: 1.4;

    text-align: center;

    z-index: 9999;

    white-space: pre-line;
}
</style>
</head>

<body>

<div class="player">

    <div class="header">
        <div class="genwave">GENWAVE</div>
        <div class="radio">RADIO</div>
    </div>

    <div class="cover">

        <div class="ring-pink"></div>
        <div class="ring-cyan"></div>

        <div class="cover-inner">

            <img
                class="logo"
                src="lg.jpg"
                alt="GenWave"
            >

            <img
                id="coverArt"
                src=""
                alt=""
            >

        </div>
    </div>

    <div class="track">

        <div id="trackName">
            GenWave Radio
        </div>

        <div class="station">
            GENWAVE RADIO
        </div>

    </div>

    <div class="volume">

        <div class="volume-line"></div>

        <div
            id="volumeHandle"
            class="volume-handle"
            style="left:80%"
        ></div>

        <input
            id="volume"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="0.8"
        >

    </div>

    <div class="play-area">

        <div class="wave"></div>

        <button
            id="playButton"
            type="button"
        >

            <svg
                id="playIcon"
                viewBox="0 0 24 24"
            >
                <path d="M8 5v14l11-7z"></path>
            </svg>

        </button>

    </div>

    <div class="status">

        <div class="live">
            <span class="dot"></span>
            LIVE
        </div>

        <div id="state">
            READY
        </div>

    </div>

</div>

<div id="debug"></div>

<audio
    id="audio"
    preload="none"
    playsinline
></audio>


<script>

/*
    GENWAVE RADIO
    Discord Activity version
*/

const STREAM_URL =
    "/radio/listen/genwave/radio.mp3";

const API_URL =
    "/radio/api/nowplaying/genwave";


const button =
    document.getElementById("playButton");

const audio =
    document.getElementById("audio");

const volume =
    document.getElementById("volume");

const volumeHandle =
    document.getElementById("volumeHandle");

const state =
    document.getElementById("state");

const trackName =
    document.getElementById("trackName");

const coverArt =
    document.getElementById("coverArt");

const debug =
    document.getElementById("debug");


let playing = false;


/* -------------------------------- */
/* DEBUG */
/* -------------------------------- */

function debugMessage(message) {

    console.log(
        "[GENWAVE]",
        message
    );

    debug.textContent =
        message;

}


/* -------------------------------- */
/* PLAY BUTTON */
/* -------------------------------- */

function handlePlayClick(event) {

    event.preventDefault();
    event.stopPropagation();

    /*
       TOTO SE MUSÍ UKÁZAT OKAMŽITĚ.
       Pokud se READY nezmění,
       JavaScript se vůbec nespouští.
    */

    state.textContent =
        "CLICKED";

    debugMessage(
        "PLAY BUTTON CLICKED"
    );


    if (playing) {

        stopRadio();

        return;
    }


    startRadio();
}


button.onclick =
    handlePlayClick;


/* -------------------------------- */
/* START */
/* -------------------------------- */

function startRadio() {

    state.textContent =
        "CONNECTING";

    debugMessage(
        "CLICKED\n\n" +
        "Trying:\n" +
        STREAM_URL
    );


    audio.volume =
        Number(volume.value);


    audio.src =
        STREAM_URL;


    let result;


    try {

        result =
            audio.play();

    } catch (error) {

        handleError(error);

        return;
    }


    if (
        result &&
        typeof result.catch ===
        "function"
    ) {

        result.catch(
            function(error) {

                handleError(error);

            }
        );

    }
}


/* -------------------------------- */
/* STOP */
/* -------------------------------- */

function stopRadio() {

    audio.pause();

    audio.removeAttribute(
        "src"
    );

    audio.load();

    playing = false;

    state.textContent =
        "READY";

    debugMessage(
        "STOPPED"
    );
}


/* -------------------------------- */
/* PLAYING */
/* -------------------------------- */

audio.addEventListener(
    "playing",
    function() {

        playing = true;

        state.textContent =
            "PLAYING";

        debugMessage(
            "STREAM PLAYING"
        );

    }
);


/* -------------------------------- */
/* WAITING */
/* -------------------------------- */

audio.addEventListener(
    "waiting",
    function() {

        state.textContent =
            "BUFFERING";

        debugMessage(
            "STREAM BUFFERING"
        );

    }
);


/* -------------------------------- */
/* CANPLAY */
/* -------------------------------- */

audio.addEventListener(
    "canplay",
    function() {

        debugMessage(
            "STREAM CAN PLAY"
        );

    }
);


/* -------------------------------- */
/* ERROR */
/* -------------------------------- */

audio.addEventListener(
    "error",
    function() {

        let text =
            "AUDIO ERROR";

        if (audio.error) {

            text +=
                "\nCODE: " +
                audio.error.code;

            if (
                audio.error.message
            ) {

                text +=
                    "\n" +
                    audio.error.message;
            }
        }

        handleError(
            new Error(text)
        );

    }
);


/* -------------------------------- */
/* ERROR HANDLER */
/* -------------------------------- */

function handleError(error) {

    playing = false;

    state.textContent =
        "ERROR";

    const message =
        error &&
        error.message
            ? error.message
            : String(error);


    debugMessage(
        "PLAY ERROR\n\n" +
        message +
        "\n\nURL:\n" +
        STREAM_URL
    );

}


/* -------------------------------- */
/* VOLUME */
/* -------------------------------- */

volume.oninput =
    function() {

        const value =
            Number(volume.value);

        audio.volume =
            value;

        volumeHandle.style.left =
            (value * 100) +
            "%";
    };


audio.volume = 0.8;


/* -------------------------------- */
/* METADATA */
/* -------------------------------- */

async function loadMetadata() {

    try {

        const response =
            await fetch(
                API_URL +
                "?t=" +
                Date.now(),
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );
        }


        const data =
            await response.json();


        if (
            data.now_playing &&
            data.now_playing.song
        ) {

            const song =
                data.now_playing.song;


            if (song.text) {

                trackName.textContent =
                    song.text;
            }


            if (song.art) {

                try {

                    const art =
                        new URL(
                            song.art
                        );


                    if (
                        art.hostname ===
                        "genwave-radio.com"
                    ) {

                        coverArt.src =
                            "/radio" +
                            art.pathname +
                            art.search;

                    } else {

                        coverArt.src =
                            song.art;
                    }


                    coverArt.style.display =
                        "block";

                } catch (e) {

                    console.log(
                        "Artwork error",
                        e
                    );
                }
            }
        }

    } catch (error) {

        console.log(
            "Metadata unavailable",
            error
        );
    }
}


/* -------------------------------- */
/* INIT */
/* -------------------------------- */

volumeHandle.style.left =
    "80%";


state.textContent =
    "READY";


loadMetadata();


setInterval(
    loadMetadata,
    10000
);


/* -------------------------------- */
/* JS TEST */
/* -------------------------------- */

console.log(
    "GENWAVE JAVASCRIPT LOADED"
);

</script>

</body>
</html>
