<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GenWave Radio</title>
    
    <script src="https://discord.com/api/embed/sdk.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@700;800&family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #03000a;
            overflow: hidden;
            font-family: 'Share Tech Mono', monospace;
            color: #ffffff;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: #03000a url('bg.jpg') center center / cover no-repeat fixed;
        }

        .player-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 390px;
            height: 100vh;
            max-height: 840px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 22px 20px 18px 20px;
        }

        .brand-header {
            text-align: center;
            margin-top: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .brand-genwave {
            font-family: 'Syncopate', sans-serif;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 6px;
            color: #d4f8ff;
            text-shadow: 0 0 10px rgba(0, 244, 255, 0.8);
        }

        .brand-radio {
            font-family: 'Syncopate', sans-serif;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 9px;
            color: #ffbbf0;
            text-shadow: 0 0 10px rgba(255, 0, 160, 0.9);
        }

        .circle-display-wrap {
            position: relative;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 30px rgba(255, 0, 160, 0.4);
        }

        .ring-magenta {
            position: absolute;
            inset: -9px;
            border-radius: 50%;
            border: 2px solid #ff00a0;
            box-shadow: 0 0 16px #ff00a0;
        }

        .ring-cyan {
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            border: 2px solid #00f4ff;
            box-shadow: 0 0 10px #00f4ff;
        }

        .circle-inner-content {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            background: #03000a;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .default-logo-img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
            z-index: 2;
            padding: 15px;
        }

        .cover-art-image {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: none;
            z-index: 3;
        }

        .track-info-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .current-track-name {
            font-size: 18px;
            color: #ffffff;
            text-align: center;
            max-width: 92%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sub-station-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            color: #00f4ff;
            letter-spacing: 3px;
        }

        /* Styl pro nativní fallback přehrávač v Discordu */
        .fallback-audio-box {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            background: rgba(0, 244, 255, 0.05);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid rgba(0, 244, 255, 0.3);
        }

        .fallback-audio-box audio {
            width: 100%;
            height: 36px;
        }

        .fallback-label {
            font-size: 11px;
            color: #00f4ff;
            letter-spacing: 1px;
        }

        .play-area-3d {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 80px;
        }

        .btn-play-3d {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 28%, #ffffff 0%, #76dcf5 70%, #129cc2 100%);
            border: 2px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 0 20px rgba(0, 244, 255, 0.9);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .icon-symbol {
            width: 24px;
            height: 24px;
            fill: #063647;
        }

        .bottom-status-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #838a9c;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <div class="brand-header">
            <div class="brand-genwave">GENWAVE</div>
            <div class="brand-radio">RADIO</div>
        </div>

        <div class="circle-display-wrap">
            <div class="ring-magenta"></div>
            <div class="ring-cyan"></div>
            <div class="circle-inner-content">
                <img src="lg.jpg" class="default-logo-img" alt="GenWave Logo">
                <img id="albumCover" class="cover-art-image" src="" alt="Album Cover">
            </div>
        </div>

        <div class="track-info-container">
            <div class="current-track-name" id="trackName">GenWave Radio</div>
            <div class="sub-station-name">GENWAVE RADIO</div>
        </div>

        <!-- ZÁLOŽNÍ NATIVNÍ AUDIO PŘEHRÁVAČ PRO DISCORD -->
        <div class="fallback-audio-box">
            <div class="fallback-label">DISCORD AUDIO FIX (Zkus spustit zde):</div>
            <audio id="nativeAudio" controls preload="none" src="https://genwave-radio.com/listen/genwave/radio.mp3"></audio>
        </div>

        <div class="play-area-3d">
            <button class="btn-play-3d" id="playPauseBtn">
                <svg id="iconPlay" class="icon-symbol" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <svg id="iconPause" class="icon-symbol" viewBox="0 0 24 24" style="display: none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
        </div>

        <div class="bottom-status-bar">
            <span>LIVE</span>
            <span id="bitrateVal">192 KBPS</span>
        </div>
    </div>

    <script>
        let discordSdk = null;
        async function initDiscord() {
            if (typeof DiscordSDK !== 'undefined') {
                try {
                    discordSdk = new DiscordSDK({ clientId: "1556777391337115678" });
                    await discordSdk.ready();
                } catch (e) {}
            }
        }
        initDiscord();

        document.addEventListener("DOMContentLoaded", () => {
            const streamUrl = 'https://genwave-radio.com/listen/genwave/radio.mp3';
            const apiUrl = 'https://genwave-radio.com/api/nowplaying/genwave';

            const nativeAudio = document.getElementById('nativeAudio');
            const playPauseBtn = document.getElementById('playPauseBtn');
            const iconPlay = document.getElementById('iconPlay');
            const iconPause = document.getElementById('iconPause');
            const albumCover = document.getElementById('albumCover');
            const trackName = document.getElementById('trackName');
            const bitrateVal = document.getElementById('bitrateVal');

            let isPlaying = false;
            let currentArt = null;

            async function updateMetadata() {
                try {
                    const res = await fetch(apiUrl);
                    const data = await res.json();
                    if (data.now_playing?.song?.text) {
                        trackName.innerText = data.now_playing.song.text;
                        if (data.now_playing.song.art) {
                            currentArt = data.now_playing.song.art;
                            if (isPlaying) {
                                albumCover.src = currentArt;
                                albumCover.style.display = 'block';
                            }
                        }
                    }
                    if (data.station?.mounts?.[0]?.bitrate) {
                        bitrateVal.innerText = data.station.mounts[0].bitrate + ' KBPS';
                    }
                } catch (e) {}
            }

            playPauseBtn.addEventListener('click', async () => {
                if (isPlaying) {
                    nativeAudio.pause();
                    isPlaying = false;
                    iconPlay.style.display = 'block';
                    iconPause.style.display = 'none';
                    albumCover.style.display = 'none';
                } else {
                    try {
                        await nativeAudio.play();
                        isPlaying = true;
                        iconPlay.style.display = 'none';
                        iconPause.style.display = 'block';
                        if (currentArt) {
                            albumCover.src = currentArt;
                            albumCover.style.display = 'block';
                        }
                    } catch (err) {
                        alert("Spusť rádio kliknutím na play v modrém obdélníku nahoře!");
                    }
                }
            });

            updateMetadata();
            setInterval(updateMetadata, 10000);
        });
    </script>
</body>
</html>
