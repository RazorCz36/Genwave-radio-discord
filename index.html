<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GenWave Radio</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@700;800&family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #03000a;
            overflow: hidden;
            font-family: 'Share Tech Mono', monospace;
            color: #ffffff;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: #03000a url('bg.jpg') center center / cover no-repeat fixed;
        }

        .player-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 390px;
            height: 100vh;
            max-height: 840px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 22px 20px 18px 20px;
        }

        .brand-header {
            text-align: center;
            margin-top: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .brand-genwave {
            font-family: 'Syncopate', sans-serif;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 6px;
            color: #d4f8ff;
            text-shadow:
                0 0 10px rgba(0, 244, 255, 0.8),
                0 0 20px rgba(0, 244, 255, 0.5),
                0 0 35px rgba(0, 244, 255, 0.3);
            line-height: 1.15;
            margin-left: 6px;
        }

        .brand-radio {
            font-family: 'Syncopate', sans-serif;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 9px;
            color: #ffbbf0;
            text-shadow:
                0 0 10px rgba(255, 0, 160, 0.9),
                0 0 22px rgba(255, 0, 160, 0.6),
                0 0 40px rgba(255, 0, 160, 0.4);
            line-height: 1.15;
            margin-left: 9px;
        }

        .circle-display-wrap {
            position: relative;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow:
                0 0 30px rgba(255, 0, 160, 0.4),
                0 0 65px rgba(140, 0, 255, 0.25);
        }

        .ring-magenta {
            position: absolute;
            inset: -9px;
            border-radius: 50%;
            border: 2px solid #ff00a0;
            box-shadow:
                0 0 16px #ff00a0,
                inset 0 0 16px rgba(255, 0, 160, 0.4);
        }

        .ring-cyan {
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            border: 2px solid #00f4ff;
            box-shadow: 0 0 10px #00f4ff;
        }

        .circle-inner-content {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            background: #03000a;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .default-logo-img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
            z-index: 2;
            padding: 15px;
        }

        .cover-art-image {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: none;
            z-index: 3;
        }

        .track-info-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .current-track-name {
            font-family: 'Share Tech Mono', monospace;
            font-size: 20px;
            color: #ffffff;
            text-align: center;
            letter-spacing: 0.5px;
            min-height: 26px;
            max-width: 92%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
        }

        .sub-station-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            font-weight: 700;
            color: #00f4ff;
            letter-spacing: 3px;
            text-shadow: 0 0 8px rgba(0, 244, 255, 0.8);
        }

        .volume-control-wrap {
            width: 88%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .dotted-slider-bar {
            position: relative;
            width: 100%;
            height: 20px;
            display: flex;
            align-items: center;
        }

        .dots-background-line {
            position: absolute;
            width: 100%;
            height: 4px;
            background-image:
                radial-gradient(circle, rgba(0, 244, 255, 0.85) 2px, transparent 2px);
            background-size: 9px 4px;
            background-repeat: repeat-x;
            top: 50%;
            transform: translateY(-50%);
            filter: drop-shadow(0 0 3px #00f4ff);
        }

        .volume-native-range {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 10;
        }

        .volume-ring-handle {
            position: absolute;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid #00f4ff;
            box-shadow:
                0 0 10px #00f4ff,
                0 0 18px #00f4ff;
            top: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            transition: left 0.05s ease-out;
        }

        .play-area-3d {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 115px;
        }
