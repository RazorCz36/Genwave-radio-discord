<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>GenWave Radio</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&family=Syncopate:wght@700;800&display=swap');

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#03000a;
}

body{
    color:white;
    font-family:'Share Tech Mono',monospace;

    background:
        #03000a
        url("bg.jpg")
        center center
        / cover
        no-repeat;

    display:flex;
    justify-content:center;
    align-items:center;
}

.player{
    width:100%;
    max-width:390px;
    height:100vh;

    padding:22px 20px 18px;

    display:flex;
    flex-direction:column;
    justify-content:space-between;
    align-items:center;
}

/* HEADER */

.header{
    text-align:center;
}

.genwave{
    font-family:'Syncopate',sans-serif;
    font-size:28px;
    font-weight:800;
    letter-spacing:6px;

    color:#d4f8ff;

    text-shadow:
        0 0 10px #00f4ff,
        0 0 25px #00f4ff,
        0 0 40px #00f4ff;
}

.radio{
    font-family:'Syncopate',sans-serif;
    font-size:26px;
    font-weight:800;
    letter-spacing:9px;

    color:#ffbbf0;

    text-shadow:
        0 0 10px #ff00a0,
        0 0 25px #ff00a0,
        0 0 40px #ff00a0;
}

/* COVER */

.cover{
    position:relative;

    width:250px;
    height:250px;

    border-radius:50%;

    box-shadow:
        0 0 30px rgba(255,0,160,.5),
        0 0 70px rgba(140,0,255,.3);
}

.ring-pink{
    position:absolute;
    inset:-9px;

    border-radius:50%;

    border:2px solid #ff00a0;

    box-shadow:
        0 0 18px #ff00a0;
}

.ring-cyan{
    position:absolute;
    inset:-3px;

    border-radius:50%;

    border:2px solid #00f4ff;

    box-shadow:
        0 0 12px #00f4ff;
}

.cover-inner{
    position:absolute;
    inset:0;

    overflow:hidden;

    border-radius:50%;

    background:#03000a;
}

.logo{
    width:100%;
    height:100%;

    object-fit:contain;

    padding:15px;
}

#album{
    display:none;

    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;
}

/* TRACK */

.track{
    width:100%;

    text-align:center;
}

#track{
    width:95%;

    margin:auto;

    min-height:27px;

    font-size:20px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;

    text-shadow:
        0 0 8px white;
}

.station{
    margin-top:5px;

    font-family:'Orbitron',sans-serif;

    font-size:12px;
    font-weight:700;

    letter-spacing:3px;

    color:#00f4ff;

    text-shadow:
        0 0 8px #00f4ff;
}

/* VOLUME */

.volume{
    position:relative;

    width:88%;
    height:25px;
}

.volume-line{
    position:absolute;

    top:50%;
    left:0;

    width:100%;
    height:4px;

    transform:translateY(-50%);

    background-image:
        radial-gradient(
            circle,
            #00f4ff 2px,
            transparent 2px
        );

    background-size:9px 4px;
}

#volume{
    position:absolute;

    inset:0;

    width:100%;

    opacity:0;

    cursor:pointer;

    z-index:5;
}

.volume-handle{
    position:absolute;

    top:50%;

    width:15px;
    height:15px;

    border-radius:50%;

    background:white;

    border:2px solid #00f4ff;

    box-shadow:
        0 0 12px #00f4ff;

    transform:
        translate(-50%,-50%);

    pointer-events:none;
}

/* PLAY */

.play-area{
    position:relative;

    width:100%;
    height:120px;

    display:flex;
    justify-content:center;
    align-items:center;
}

.wave{
    position:absolute;

    width:210px;
    height:65px;

    border:
        1px solid
        rgba(0,244,255,.5);

    border-radius:50%;

    transform:rotateX(70deg);

    box-shadow:
        0 0 15px
        rgba(0,244,255,.5);
}

#play{
    position:relative;

    z-index:50;

    width:82px;
    height:82px;

    border-radius:50%;

    border:2px solid white;

    background:
        radial-gradient(
            circle at 35% 28%,
            white 0%,
            #dffaff 35%,
            #70d9f5 70%,
            #129cc2 100%
        );

    box-shadow:
        0 0 30px #00f4ff,
        0 12px 20px rgba(0,0,0,.7),
        inset 0 -5px 10px rgba(0,130,180,.6);

    cursor:pointer;

    display:flex;
    justify-content:center;
    align-items:center;

    touch-action:manipulation;

    -webkit-tap-highlight-color:transparent;
}

#play:active{
    transform:scale(.90);
}

#play svg{
    width:30px;
    height:30px;

    fill:#063647;
}

/* STATUS */

.status{
    width:100%;

    padding-top:12px;

    border-top:
        1px solid
        rgba(255,255,255,.12);

    display:flex;
    justify-content:space-between;
    align-items:center;

    font-family:'Orbitron',sans-serif;

    font-size:11px;

    letter-spacing:1.5px;
}

.live{
    display:flex;
    align-items:center;

    gap:7px;

    color:#ff0055;
}

.dot{
    width:8px;
    height:8px;

    border-radius:50%;

    background:#ff0055;

    box-shadow:
        0 0 8px #ff0055;
}

#status{
    color:#00f4ff;
}

/* MESSAGE */

#message{
    position:fixed;

    left:15px;
    right:15px;
    bottom:65px;

    z-index:999;

    display:none;

    padding:12px;

    border:
        1px solid
        rgba(0,244,255,.5);

    border-radius:10px;

    background:
        rgba(3,0,10,.96);

    color:#bcecff;

    font-size:12px;

    line-height:1.5;

    text-align:center;

    white-space:pre-line;
}

</style>
</head>


<body>

<div class="player">

    <div class="header">

        <div class="genwave">
            GENWAVE
        </div>

        <div class="radio">
            RADIO
        </div>

    </div>


    <div class="cover">

        <div class="ring-pink"></div>

        <div class="ring-cyan"></div>

        <div class="cover-inner">

            <img
                class="logo"
                src="lg.jpg"
                alt="GenWave"
            >

            <img
                id="album"
                src=""
                alt="Album"
            >

        </div>

    </div>


    <div class="track">

        <div id="track">
            GenWave Radio
        </div>

        <div class="station">
            GENWAVE RADIO
        </div>

    </div>


    <div class="volume">

        <div class="volume-line"></div>

        <div
            id="volumeHandle"
            class="volume-handle"
            style="left:80%"
        ></div>

        <input
            id="volume"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="0.8"
        >

    </div>


    <div class="play-area">

        <div class="wave"></div>

        <!-- IMPORTANT:
             onclick is directly on the button -->

        <button
            id="play"
            type="button"
            onclick="toggleRadio()"
        >

            <svg
                id="playIcon"
                viewBox="0 0 24 24"
            >
                <path d="M8 5v14l11-7z"></path>
            </svg>

        </button>

    </div>


    <div class="status">

        <div class="live">

            <span class="dot"></span>

            LIVE

        </div>

        <div id="status">
            READY
        </div>

    </div>

</div>


<div id="message"></div>


<audio
    id="audio"
    preload="none"
    playsinline
></audio>


<script>

/*
==================================================
GENWAVE RADIO
DISCORD ACTIVITY
==================================================
*/


const STREAM =
    "/radio/listen/genwave/radio.mp3";

const API =
    "/radio/api/nowplaying/genwave";


let playing =
    false;


const audio =
    document.getElementById("audio");

const button =
    document.getElementById("play");

const status =
    document.getElementById("status");

const message =
    document.getElementById("message");

const volume =
    document.getElementById("volume");

const volumeHandle =
    document.getElementById("volumeHandle");

const track =
    document.getElementById("track");

const album =
    document.getElementById("album");


/*
==================================================
MESSAGE
==================================================
*/

function showMessage(text){

    message.innerText =
        text;

    message.style.display =
        "block";

}


/*
==================================================
HIDE MESSAGE
==================================================
*/

function hideMessage(){

    message.style.display =
        "none";

}


/*
==================================================
STATUS
==================================================
*/

function setStatus(text){

    status.innerText =
        text;

}


/*
==================================================
PLAY
==================================================
*/

function playRadio(){

    hideMessage();

    setStatus(
        "CONNECTING..."
    );


    audio.volume =
        parseFloat(
            volume.value
        );


    audio.src =
        STREAM;


    console.log(
        "GENWAVE PLAY:",
        STREAM
    );


    try{

        const p =
            audio.play();


        if(p){

            p.then(
                function(){

                    playing =
                        true;

                    setStatus(
                        "PLAYING"
                    );

                    console.log(
                        "GENWAVE PLAYING"
                    );

                }
            );


            p.catch(
                function(error){

                    playing =
                        false;

                    setStatus(
                        "ERROR"
                    );

                    showMessage(
                        "PŘEHRÁVÁNÍ SELHALO\n\n" +
                        error.name +
                        "\n" +
                        error.message
                    );

                    console.error(
                        error
                    );

                }
            );

        }

    }catch(error){

        playing =
            false;

        setStatus(
            "ERROR"
        );

        showMessage(
            "PŘEHRÁVÁNÍ SELHALO\n\n" +
            error.name +
            "\n" +
            error.message
        );

    }

}


/*
==================================================
STOP
==================================================
*/

function stopRadio(){

    audio.pause();

    audio.removeAttribute(
        "src"
    );

    audio.load();

    playing =
        false;

    setStatus(
        "READY"
    );

}


/*
==================================================
TOGGLE
==================================================
*/

function toggleRadio(){

    /*
       THIS LINE EXECUTES DIRECTLY
       FROM THE BUTTON.
    */

    setStatus(
        "CLICKED"
    );


    if(playing){

        stopRadio();

    }else{

        playRadio();

    }

}


/*
==================================================
AUDIO EVENTS
==================================================
*/

audio.addEventListener(
    "playing",
    function(){

        playing =
            true;

        setStatus(
            "PLAYING"
        );

    }
);


audio.addEventListener(
    "waiting",
    function(){

        if(playing){

            setStatus(
                "BUFFERING..."
            );

        }

    }
);


audio.addEventListener(
    "error",
    function(){

        playing =
            false;

        setStatus(
            "ERROR"
        );


        let text =
            "STREAM ERROR";


        if(audio.error){

            text +=
                "\n\nCODE: " +
                audio.error.code;

            if(audio.error.message){

                text +=
                    "\n" +
                    audio.error.message;

            }

        }


        showMessage(
            text
        );

    }
);


/*
==================================================
VOLUME
==================================================
*/

volume.addEventListener(
    "input",
    function(){

        const value =
            parseFloat(
                volume.value
            );


        audio.volume =
            value;


        volumeHandle.style.left =
            (value * 100) +
            "%";

    }
);


/*
==================================================
METADATA
==================================================
*/

async function updateMetadata(){

    try{

        const response =
            await fetch(
                API +
                "?t=" +
                Date.now(),
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        if(
            data.now_playing &&
            data.now_playing.song
        ){

            const song =
                data.now_playing.song;


            if(song.text){

                track.innerText =
                    song.text;

            }


            if(song.art){

                try{

                    const art =
                        new URL(
                            song.art
                        );


                    if(
                        art.hostname
                            .toLowerCase() ===
                        "genwave-radio.com"
                    ){

                        album.src =
                            "/radio" +
                            art.pathname +
                            art.search;

                    }else{

                        album.src =
                            song.art;

                    }


                    album.style.display =
                        "block";

                }catch(e){

                    console.log(
                        "ART ERROR",
                        e
                    );

                }

            }

        }

    }catch(e){

        console.log(
            "API ERROR",
            e
        );

    }

}


/*
==================================================
INITIALIZATION
==================================================
*/

audio.volume =
    0.8;

volume.value =
    0.8;

volumeHandle.style.left =
    "80%";


updateMetadata();


setInterval(
    updateMetadata,
    10000
);


console.log(
    "GENWAVE ACTIVITY LOADED"
);

</script>

</body>
</html>
